name: CI

on:
  workflow_dispatch:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install schema validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check OpenAPI spec drift
        run: make spec-check ENV=prod

      - name: Build SDK
        run: make build

      - name: Run tests
        run: make test

      - name: Validate NuGet package
        run: make pack

  native-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Test bundled validator and SDK on both supported .NET versions
        run: dotnet test tests/cheqi-sdk.Tests/cheqi-sdk.Tests.csproj --configuration Release
