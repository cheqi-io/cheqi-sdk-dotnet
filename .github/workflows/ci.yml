name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Restore SDK
        run: dotnet restore cheqi-sdk.csproj

      - name: Build SDK
        run: dotnet build cheqi-sdk.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test tests/cheqi-sdk.Tests/cheqi-sdk.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"
